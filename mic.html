<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이크 점검</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2733;--soft:#5c6779;--line:#e3e8f0;--brand:#4f6ef7;--ok:#14a06a;--no:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6;padding:18px}
h1{font-size:20px;margin:6px 0 4px}
p.sub{margin:0 0 16px;color:var(--soft);font-size:14px}
button{width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;font-size:19px;font-weight:800;padding:20px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row b{font-weight:800;text-align:right;word-break:break-all}
.ok{color:var(--ok)} .no{color:var(--no)}
#verdict{font-size:16px;font-weight:800;margin-top:14px;padding:14px;border-radius:14px;background:#fff;border:2px solid var(--line)}
#level{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:10px}
#level i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
small{color:var(--soft)}
</style>
</head>
<body>
<h1>🎤 마이크 점검</h1>
<p class="sub">아래 버튼을 누르고, 나오는 내용을 아빠에게 보여 주세요.</p>
<button id="go">마이크 테스트 시작</button>
<div id="verdict">아직 검사하지 않았어요.</div>
<div id="level"><i></i></div>
<div class="card" id="info"></div>
<p><small>이 페이지는 소리를 저장하거나 보내지 않습니다. 마이크가 켜지는지만 확인합니다.</small></p>
<script>
const $ = (s) => document.querySelector(s);
const rows = [];
function row(k, v, cls) { rows.push('<div class="row"><span>' + k + '</span><b class="' + (cls || '') + '">' + v + '</b></div>'); $('#info').innerHTML = rows.join(''); }

function basics() {
  rows.length = 0;
  row('주소', location.host);
  row('보안 연결(HTTPS)', isSecureContext ? '예' : '아니오', isSecureContext ? 'ok' : 'no');
  row('마이크 기능 있음', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? '예' : '아니오',
      navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'ok' : 'no');
  row('홈 화면 앱으로 열림', matchMedia('(display-mode: standalone)').matches ? '예' : '아니오(브라우저)');
  const ua = navigator.userAgent;
  row('브라우저', /SamsungBrowser/.test(ua) ? '삼성 인터넷' : /Chrome/.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' : '기타',
      /Chrome/.test(ua) && !/SamsungBrowser/.test(ua) ? 'ok' : 'no');
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'microphone' }).then(function (st) {
      row('사이트 마이크 설정', st.state === 'granted' ? '허용됨' : st.state === 'denied' ? '차단됨' : '물어봄',
          st.state === 'granted' ? 'ok' : st.state === 'denied' ? 'no' : '');
    }).catch(function () { row('사이트 마이크 설정', '확인 불가'); });
  }
}
basics();

$('#go').onclick = async function () {
  $('#verdict').textContent = '확인하는 중…';
  basics();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const t = stream.getAudioTracks()[0];
    row('마이크 이름', (t && t.label) || '(이름 없음)', 'ok');
    $('#verdict').innerHTML = '<span class="ok">마이크가 켜졌습니다. 말해 보세요 — 아래 막대가 움직이면 정상입니다.</span>';
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    let peak = 0;
    (function loop() {
      an.getByteTimeDomainData(buf);
      let m = 0;
      for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));
      peak = Math.max(peak, m);
      $('#level i').style.width = Math.min(100, (m / 60) * 100) + '%';
      requestAnimationFrame(loop);
    })();
    setTimeout(function () {
      row('소리 들어옴', peak > 3 ? '예' : '아니오(조용하거나 음소거)', peak > 3 ? 'ok' : 'no');
    }, 4000);
  } catch (e) {
    const n = e && e.name ? e.name : '알 수 없음';
    row('실패 이름', n, 'no');
    row('실패 내용', (e && e.message) || '-', 'no');
    let why = '';
    if (n === 'NotAllowedError') why = '권한이 거부된 상태입니다. 폰 설정 → 앱 → Chrome → 권한 → 마이크를 허용하거나, 주소창 자물쇠 → 권한에서 마이크를 허용해 주세요.';
    else if (n === 'NotFoundError') why = '마이크 장치를 찾지 못했습니다.';
    else if (n === 'NotReadableError') why = '다른 앱이 마이크를 쓰고 있습니다. 통화·녹음 앱을 끄고 다시 해 보세요.';
    else if (n === 'SecurityError') why = '보안 연결 문제입니다.';
    else why = '원인을 더 확인해야 합니다.';
    $('#verdict').innerHTML = '<span class="no">마이크를 켜지 못했습니다.</span><br><small>' + why + '</small>';
  }
};
</script>
</body>
</html>
