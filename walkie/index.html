<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무전기 — 주소가 바뀌었습니다</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
  .box{text-align:center;padding:24px;max-width:420px}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#9aa7b2;line-height:1.6;margin:0 0 18px}
  a{display:inline-block;background:#2f81f7;color:#fff;text-decoration:none;
    padding:12px 20px;border-radius:12px;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <h1>무전기 주소가 바뀌었습니다</h1>
    <p>잠시 후 새 주소로 이동합니다.<br>새 주소에서 홈 화면에 추가해 주세요.</p>
    <a href="https://reaver100.github.io/jh-walkie-app/">새 무전기로 이동</a>
  </div>
<script>
  /* 옛 주소에 남아 있던 서비스워커와 캐시를 정리한 뒤 넘어간다 */
  (async function(){
    try{
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i=0;i<regs.length;i++){
        if (regs[i].scope.indexOf("/jh-workbook/walkie/") >= 0) await regs[i].unregister();
      }
      var ks = await caches.keys();
      for (var j=0;j<ks.length;j++){
        if (ks[j].indexOf("walkie-") === 0) await caches.delete(ks[j]);
      }
    }catch(e){}
    location.replace("https://reaver100.github.io/jh-walkie-app/");
  })();
</script>
</body>
</html>
